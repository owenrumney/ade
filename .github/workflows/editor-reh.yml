# The editor server a window on another machine runs, for linux arm64 and x64.
#
# The server must be built from the same commit as the client, or the
# workbench refuses the websocket with "Client refused: version mismatch", so
# each runner does VSCodium's fetch, ade's patches and make editor-sync before
# the reh gulp tasks. Published as a pre-release under the pin's
# RELEASE_VERSION, which is where product.json's serverDownloadUrlTemplate
# already points. See .git/ade/docs/remote-sessions-vscodium.md.
name: editor server

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: The pin to publish for, which must be editor/env.sh's RELEASE_VERSION
        required: false
  push:
    branches: [main]
    paths:
      - editor/env.sh
      - editor/patches/**
      - .github/workflows/editor-reh.yml

permissions:
  contents: write

# Two runs for one pin would upload the same two assets over each other.
concurrency:
  group: editor-reh-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    # Fetch, prepare and package is 25 to 40 minutes per arch.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Read the pin
        id: pin
        run: |
          . editor/env.sh
          echo "ms_commit=$MS_COMMIT" >> "$GITHUB_OUTPUT"
          echo "release_version=$RELEASE_VERSION" >> "$GITHUB_OUTPUT"

      # The dispatch names the pin it means. A run against a tree that has
      # moved on would publish a server no client asks for.
      - name: Check the dispatched pin is this one
        if: inputs.release_version != ''
        run: |
          . editor/env.sh
          test "${{ inputs.release_version }}" = "$RELEASE_VERSION" || {
            echo "this tree builds $RELEASE_VERSION, not ${{ inputs.release_version }}" >&2
            exit 1
          }

      # Keyed by the vscode commit: a pin that has not moved reuses both.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            editor/node24
          key: editor-reh-${{ matrix.arch }}-${{ steps.pin.outputs.ms_commit }}
          restore-keys: editor-reh-${{ matrix.arch }}-

      - run: tools/editor/fetch.sh

      # VSCodium's patches, then ade's, then npm ci. About ten minutes.
      - run: tools/editor/prepare.sh
        env:
          OS_NAME: linux
          VSCODE_ARCH: ${{ matrix.arch }}
          CI_BUILD: "yes"

      - run: tools/editor/reh.sh ${{ matrix.arch }}

      # Pre-release, so the editor server never becomes this repository's
      # "Latest" and the Go binary's own releases stay the ones people see.
      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.pin.outputs.release_version }}
        run: |
          set -eu
          gh release view "$VERSION" >/dev/null 2>&1 ||
            gh release create "$VERSION" \
              --prerelease \
              --title "editor server $VERSION" \
              --notes "The remote extension host ade's ade-ssh resolver downloads. Not a release of the ade binary."
          gh release upload "$VERSION" \
            editor/vscodium/assets/ade-reh-linux-${{ matrix.arch }}-"$VERSION".tar.gz \
            --clobber
