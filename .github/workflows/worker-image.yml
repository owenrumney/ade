name: worker image

on:
  push:
    branches: [main]
    paths:
      - worker/**
      - provisioner/**
      - cmd/**
      - internal/**
      - go.mod
      - go.sum
      - .github/workflows/worker-image.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: worker/Dockerfile
          load: true
          tags: ade-worker:smoke
      - name: Verify worker Docker client
        run: |
          docker run --rm ade-worker:smoke docker --version
          docker run --rm ade-worker:smoke docker compose version
          docker run --rm ade-worker:smoke gh --version
          ! docker run --rm ade-worker:smoke sh -c 'command -v dockerd'
      # Both images build before either :latest moves. The worker and the
      # provisioner are one contract, and a half-published pair is worse than none.
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: worker/Dockerfile
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=${{ github.sha }}
          tags: ghcr.io/${{ github.repository_owner }}/ade-worker:${{ github.sha }}
          outputs: type=cacheonly
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: provisioner/Dockerfile
          platforms: linux/amd64,linux/arm64
          tags: ghcr.io/${{ github.repository_owner }}/ade-provisioner:${{ github.sha }}
          outputs: type=cacheonly
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: worker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ github.sha }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/ade-worker:latest
            ghcr.io/${{ github.repository_owner }}/ade-worker:${{ github.sha }}
          cache-from: type=gha
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: provisioner/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/ade-provisioner:latest
            ghcr.io/${{ github.repository_owner }}/ade-provisioner:${{ github.sha }}
          cache-from: type=gha
